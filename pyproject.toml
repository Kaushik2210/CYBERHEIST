[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberheist"
dynamic = ["version"]
description = "CYBERHEIST: THE TERMINAL BREAK-IN, an ASCII cyberpunk puzzle game for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaushik" }]
keywords = ["game", "terminal", "ascii", "puzzle", "cyberpunk"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Kaushik2210/CYBERHEIST"
Changelog = "https://github.com/Kaushik2210/CYBERHEIST/blob/main/CHANGELOG.md"
Issues = "https://github.com/Kaushik2210/CYBERHEIST/issues"

[project.scripts]
cyberheist = "cyberheist.main:main"

[tool.setuptools.dynamic]
version = { attr = "cyberheist.__version__" }

[tool.setuptools.packages.find]
include = ["cyberheist*"]

[tool.setuptools.package-data]
"cyberheist.config" = ["settings.json"]
"cyberheist.database" = ["schema.sql"]
"cyberheist.missions" = ["campaign/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
