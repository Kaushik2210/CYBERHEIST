<text y="90.4"><tspan x="18.0" textLength="655.2" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">╔═ PASSPHRASE ═══════════════════════════════════════════════════════════════╗</tspan></text>
<text y="108.4"><tspan x="18.0" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan><tspan x="26.4" textLength="638.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> Pattern: WWWWWDDS   (W = letter, D = digit, S = symbol)                    </tspan><tspan x="664.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan></text>
<text y="126.4"><tspan x="18.0" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan><tspan x="26.4" textLength="638.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> Base word is one of: NEXUS GLYPH SONAR VAPOR ORBIT EMBER LASER OCEAN       </tspan><tspan x="664.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan></text>
<text y="144.4"><tspan x="18.0" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan><tspan x="26.4" textLength="638.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> Symbol is one of: % &amp; # $                                                  </tspan><tspan x="664.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan></text>
<text y="162.4"><tspan x="18.0" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan><tspan x="26.4" textLength="638.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> Digit 1 is between 0 and 3.                                                </tspan><tspan x="664.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan></text>
<text y="180.4"><tspan x="18.0" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan><tspan x="26.4" textLength="638.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> Digit 2 is between 4 and 7.                                                </tspan><tspan x="664.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#3fff8b">║</tspan></text>
